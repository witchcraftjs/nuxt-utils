packages:
  - ./
  - playground/

allowBuilds:
  '@alanscodelog/eslint-config': false
  '@alanscodelog/tsconfigs': false
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: false

allowUnusedPatches: true

catalog:
  '@alanscodelog/eslint-config': ^6.3.0
  '@alanscodelog/semantic-release-config': ^6.0.2
  '@alanscodelog/tsconfigs': ^6.3.0
  '@alanscodelog/utils': ^6.2.0
  '@commitlint/cli': ^19.8.1
  '@nuxt/eslint-config': ^1.9.0
  '@nuxt/kit': ^4.1.1
  '@nuxt/module-builder': ^1.0.2
  '@nuxt/schema': ^4.1.1
  '@nuxt/test-utils': ^3.19.2
  change-case: ^5.4.4
  changelogen: ^0.6.2
  defu: ^6.1.4
  eslint: ^9.35.0
  fast-glob: ^3.3.3
  husky: ^9.1.7
  nuxt: ^4.2.1
  tailwind-merge: ^3.6.0
  typescript: ^6.0.3
  vitest: ^3.2.4
  vue: ^3.5.34
  vue-tsc: ^3.3.1

patchedDependencies:
  '@nuxt/module-builder': patches/@nuxt__module-builder.patch

settings:
  catalogMode: strict
  cleanupUnusedCatalogs: false

shamefullyHoist: true
strictPeerDependencies: false
minimumReleaseAge: 20160
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - "@alanscodelog/*"
  - "@witchcraft/*"
